# The site as a service: its pages on canmi.net, and its API, which runs in the same Worker, as the
# `site` scope of the API host. Cloudflare builds it; see platform's spec/architecture/services.md.
version = 1
name = "site"
placements = ["workers"]

# The Worker answers its API under `/api/`, beside its pages. See platform's
# spec/architecture/services.md, "The site's API runs in the site's Worker".
[api]
public = true
prefix = "/api"

# What the API says about the corpus holds until the next publication, and so does a refusal; its
# own failure is kept nowhere, which would turn a blip into an outage. See
# platform's spec/architecture/artifacts.md, "The key says what may cache it".
[api.defaults.cache.success]
fulfilled = "5m"
redirected = "5m"

[api.defaults.cache.failure]
rejected = "5m"
faulted = "none"

# Whether this address liked an article: an answer for one caller, never shared.
[[api.routes]]
path = "/like"
cache = { success = { fulfilled = "none" }, failure = { rejected = "none" } }
