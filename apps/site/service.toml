# The site as a service: its pages on canmi.net, and its API, which runs in the same Worker, as the
# `site` scope of the API host. Cloudflare builds it; see spec/architecture/services.md.
version = 1
name = "site"
placements = ["workers"]

# The Worker answers its API under `/api/`, beside its pages. See spec/architecture/services.md,
# "The site's API runs in the site's Worker".
[api]
public = true
prefix = "/api"
