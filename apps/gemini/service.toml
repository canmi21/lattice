# What host needs to run this service. The record is read by host on the machine, a program
# deployed apart from this file, so it carries a version. See spec/architecture/host.md.
version = 1
name = "gemini"
placements = ["home"]

[container]
# The port it was published on before host ran it, kept so nothing has to learn another.
port = 20830
health = "/"
# About 40 MiB.
memory_mb = 128

# Its SQLite: Google's cookies and the API key, which its own panel writes.
[data]
path = "/data"

# Its own panel is under `/admin`, behind Access on the public side.
[interface]
home = "/admin"
