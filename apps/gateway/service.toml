# The gateway, deployed twice: on Workers by Cloudflare, and at home by host, where the LAN asks the
# same names. One of the platform's own. See spec/architecture/gateway.md, "Inside the house, the
# same names answer locally".
version = 1
name = "gateway"
placements = ["workers", "home"]

[container]
# The port it has in development, kept inside its container too.
port = 26512
health = "/health"
memory_mb = 128

# Written by `mise run scopes` from @monoflake/sdk's gateway names; do not edit.
# Claimed only where the node grants the gateway `hosts`.
[edge]
hosts = ["*.monoflake.com", "*.monoflake.net", "*.ixc.one", "ill.li", "symlink.si"]
names = ["api.monoflake.com", "cdn.monoflake.com", "api.monoflake.net", "cdn.monoflake.net", "ill.li", "symlink.si"]
deployments = { zone = "ixc.one", regions = ["rdu", "glo"], providers = ["int", "cf", "vcl"] }
