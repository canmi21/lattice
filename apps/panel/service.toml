# What host needs to run this service. The record is read by host on the machine, a program
# deployed apart from this file, so it carries a version. See spec/architecture/host.md.
version = 1
name = "panel"
placements = ["home"]

# Its name is reserved, and host runs it on its own network and on host's, where host's API is:
# the one other container that reaches it. See spec/architecture/host.md, "The panel is an app of
# its own".
[container]
# The port it has in development, kept inside its container too.
port = 26519
health = "/health"
# About 26 MiB of Node idle, with room for pages rendered while an upload streams through.
memory_mb = 128

# infra.canmi.icu and infra.canmi.app: the reserved name `panel` stays inside the node, and
# `infra` is what reaches it from outside. See spec/architecture/host.md, "One name inside, and a
# domain label outside".
[interface]
domain = "infra"
