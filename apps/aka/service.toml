# The alias layer: the `aka` service behind the gateway, at `ill.li`, `symlink.si` and as a scope of
# the API host. See spec/architecture/gateway.md and spec/architecture/delivery.md.
version = 1
name = "aka"
placements = ["workers"]

# A resolution is as fresh as the API answer behind it, and so is a name the corpus does not
# publish; the API out of reach is a blip, kept nowhere, since every icon on a page comes through
# here. See spec/architecture/delivery.md, "What this layer lets a cache keep".
[api]
public = true

# Every answer is a redirect to a public object, so a crawler may follow any of them.
[api.defaults]
crawlable = true

[api.defaults.cors]
origins = "public"

[api.defaults.cache.success]
fulfilled = "5m"
redirected = "5m"

[api.defaults.cache.failure]
rejected = "5m"
faulted = "none"
