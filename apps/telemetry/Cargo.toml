[package]
name = "telemetry"
version = "0.0.0"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
bytes = "1.12.1"
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["client", "http1"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "tls12", "ring", "webpki-tokio"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "tokio"] }
mimalloc = "0.1.52"
response = { path = "../../libs/response", features = ["axum"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "signal", "time", "fs"] }
url = "2.5.8"
monoflake = { path = "../../libs/sdk" }

[dev-dependencies]
tempfile = "3.27.0"
tower = { version = "0.5", features = ["util"] }
