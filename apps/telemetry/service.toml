# What host needs to run this service. The record is read by host on the machine, a program
# deployed apart from this file, so it carries a version. See spec/architecture/host.md.
version = 1
name = "telemetry"
placements = ["home"]

[container]
# Sputnik sent the first telemetry in 1957. See spec/architecture/services.md, "A service keeps
# one port".
port = 19570
health = "/health"
# It keeps nothing of its own: three sources read fresh on every answer. See
# spec/architecture/telemetry.md, "The service".
memory_mb = 64

# `services.json`, written by host, as it writes `schedules.json` for `cron`. See
# spec/architecture/telemetry.md, "`services.json`, what host tells".
[data]
path = "/data"

# The `telemetry` scope of the API host: public through the gateway, which limits it by address.
# See spec/architecture/telemetry.md.
[api]
public = true

# What moves is kept five seconds, and the rest a minute; the node out of reach, half a minute. See
# spec/architecture/telemetry.md.
[api.defaults.cache.success]
fulfilled = "1m"

[api.defaults.cache.failure]
faulted = "30s"

[[api.routes]]
path = "/machine"
cache = { success = { fulfilled = "5s" } }

[[api.routes]]
path = "/services"
cache = { success = { fulfilled = "5s" } }

[[api.limits]]
methods = ["GET", "HEAD"]
path = "/machine"
count = 120
seconds = 60

[[api.limits]]
methods = ["GET", "HEAD"]
path = "/machine/series"
count = 120
seconds = 60

[[api.limits]]
methods = ["GET", "HEAD"]
path = "/services"
count = 120
seconds = 60

[[api.limits]]
methods = ["GET", "HEAD"]
path = "/topology"
count = 120
seconds = 60

[[api.limits]]
methods = ["GET", "HEAD"]
path = "/activity"
count = 120
seconds = 60
