# keeper as host deploys it. Its shape is the platform's and not this file's to choose; see
# spec/architecture/host.md, "host never updates itself; keeper updates host".
version = 1
name = "keeper"
placements = ["home"]

[container]
# One below host's 11011: the one that stands in front of it.
port = 11010
health = "/health"
# 9 MiB idle, and past 16 fetching host's image, where 16 was met and keeper killed mid-deploy.
memory_mb = 64

# keeper.canmi.icu and keeper.canmi.app both, behind Access on the tunnel's side too. See
# spec/architecture/host.md, "keeper has its own intake".
[interface]
