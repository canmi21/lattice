# What host needs to run this service. The record is read by host on the machine, a program
# deployed apart from this file, so it carries a version. See spec/architecture/host.md.
version = 1
name = "postgres"
placements = ["home"]

# Never run under this name: every app's `<app>-postgres` sidecar runs this image, on this port and
# under this ceiling unless the app names one. Asked by starting a session, so `health` goes unread.
# See spec/architecture/databases.md.
[container]
port = 5432
health = "/"
memory_mb = 192
