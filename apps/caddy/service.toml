# What host needs to run this service. The record is read by host on the machine, a program
# deployed apart from this file, so it carries a version. See spec/architecture/host.md.
version = 1
name = "caddy"
placements = ["home"]

# Its ports are its shape's, not a declaration's: the edge publishes 80 and 443. host checks its
# health on the admin socket in its directory, where it also loads every configuration.
[container]
socket = "admin.sock"
health = "/config/"
memory_mb = 256

# Its certificates and state; the configuration host renders sits beside it, in `host/`.
[data]
path = "/data"
