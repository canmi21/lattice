# What host needs to run this service. The record is read by host on the machine, a program
# deployed apart from this file, so it carries a version. See spec/architecture/host.md.
version = 1
name = "clickhouse"
placements = ["home"]

# Never run under this name: every app's `<app>-clickhouse` sidecar runs this image, on this port
# and under this ceiling unless its own `service.toml` gives a different one. See
# spec/architecture/databases.md.
[container]
port = 8123
health = "/ping"
memory_mb = 1536
