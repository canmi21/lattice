# What host needs to run this service. The record is read by host on the machine, a program
# deployed apart from this file, so it carries a version. See spec/architecture/host.md.
version = 1
name = "umami"
placements = ["home"]

[container]
# 3000 is the image's own default, moved into our range. See spec/architecture/services.md, "A
# service keeps one port".
port = 13000
health = "/api/heartbeat"
# The image is a Next.js server holding no data of its own; Postgres carries it. About 300 MiB.
memory_mb = 384

# Its one database. See spec/architecture/databases.md.
[postgres]

# The dashboard, behind Access: `umami.canmi.app`. See spec/analytics.md, "Neither service is
# self-hosted, and analytics of our own comes later".
[interface]

# The `umami` scope of the API host: the gateway opens only as far as a reporting page needs,
# `POST /api/send`, by the routes below, and refuses every other path with `no_such_route`, so
# nothing of the dashboard's own API is public.
[api]
public = true

# A reporting page's one call, from the status page's doors, and nothing else of umami's API: its
# dashboard is behind Access. The headers are what v3's tracker sends beside `Content-Type`. See
# spec/analytics.md, "Neither service is self-hosted, and analytics of our own comes later".
[api.defaults]
exposed = false

[[api.routes]]
path = "/api/send"
exposed = true
cors = { origins = ["status"], methods = ["POST"], headers = ["x-umami-website-id", "x-umami-hostname", "x-umami-cache"] }

# One address may report sixty times a minute.
[[api.limits]]
methods = ["POST"]
path = "/api/send"
count = 60
seconds = 60
