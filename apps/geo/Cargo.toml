[package]
name = "geo"
version = "0.0.0"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
geocode = { path = "../../libs/geocode" }
response = { path = "../../libs/response", features = ["axum"] }
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
anyhow = "1.0.104"
mimalloc = "0.1.52"

[dev-dependencies]
http-body-util = "0.1.5"
serde_json = "1.0.151"
tower = { version = "0.5", features = ["util"] }
