[package]
name = "canmi"
version = "0.0.0"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

# The Rust half of the `canmi` package: `urls/src/lib.rs` is generated from `urls/src/index.ts` by
# `mise run urls`. See spec/architecture/layers.md, "Addresses are split by who owns the name".
[lib]
path = "urls/src/lib.rs"
