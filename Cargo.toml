[workspace]
resolver = "3"

# Listed explicitly rather than globbed: Cargo errors on any matched directory without a
# Cargo.toml, so a glob over `apps/*` would break every cargo command the moment a
# TypeScript-only directory appeared there.
members = [
	"platform/apps/apt",
	"platform/apps/cron",
	"infra/apps/meter",
	"platform/apps/probe",
	"platform/apps/geo",
	"infra/apps/host",
	"infra/apps/keeper",
	"platform/apps/ledger",
	"apps/local",
	"platform/apps/shot",
	"platform/apps/telemetry",
	"infra/libs/deploy",
	"lib/crates/geocode",
	"platform/libs/ledger",
	"lib/crates/response",
	"lib/crates/canmi",
	"platform/libs/sdk",
]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.lints.clippy]
# Formatting belongs to rustfmt; see spec/lint-format.md.
correctness = "deny"
suspicious = "deny"
complexity = "warn"

# Our own crates at 0 so an edit-build cycle stays short, dependencies at 3 and cached --
# nearly all the work in a dev run is inside rav1e and fast_image_resize. Not "z": a
# size-optimised AVIF encoder is a slower one, and nobody downloads this. See spec/code.md.
[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 3

# What an image ships, and nothing else builds with it. Speed rather than size, since a server's
# binary is paid for on every request and its bytes never; no debugger reads what it would carry.
# No target-cpu, so an image runs on any arm64 node. See spec/architecture/host.md.
[profile.container]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
strip = "symbols"
