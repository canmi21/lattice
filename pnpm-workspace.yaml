# Globs are safe here: pnpm only picks up directories that contain a package.json and
# ignores the rest, so Rust-only libraries under libs/ are simply invisible to it. Cargo
# has no such tolerance, which is why Cargo.toml lists its members by hand instead.
packages:
  - apps/*
  - libs/*
  # The site's API, a package inside the site because its type program is workerd's, not the
  # browser's; see spec/architecture/site-api.md.
  - apps/site/api

overrides:
  # drizzle-orm takes better-sqlite3 as an optional peer, and a package that does not declare it was
  # left on the lockfile's older one while libs/collection moved on: two drizzles whose
  # table types cannot meet, which apps/local, holding both, failed to typecheck on. One
  # version for everybody.
  'better-sqlite3': ^13.0.3
  '@types/better-sqlite3': ^9.6.0

  # 3.0.4 pins lix 0.15.1, which fails every paraglide compile with "No Lix transaction is
  # active" -- silently, leaving the last good catalogues on disk, so a message added after
  # the break does not exist at runtime. Pinned here because the inner pin is exact.
  '@inlang/sdk': 3.0.2

  # drizzle-kit still pulls the deprecated @esbuild-kit loaders, pinned at ~0.18.20 and so
  # unable to reach the patched 0.25. The advisory is about esbuild's dev server, which this
  # chain never starts; the override exists so the alert does not mask a real one later.
  '@esbuild-kit/core-utils>esbuild': ^0.25.12

# runed declares SvelteKit an optional peer at ^2 and has not been released since SvelteKit 3. It
# reaches for SvelteKit only in its `runed/kit` subpath, which nothing here imports, bits-ui
# included; drop this once runed declares 3.
peerDependencyRules:
  allowedVersions:
    'runed>@sveltejs/kit': '3'

# An install script runs arbitrary code before anybody reads the package, which is why pnpm
# blocks it. These are allowed because they cannot work otherwise: each unpacks a
# platform-specific native binary. Nothing goes in this list to make a warning go away.
allowBuilds:
  '@sentry/cli': true
  # Compiles or unpacks a native binding; a pure-JS SQLite is not what this is.
  better-sqlite3: true
  cn-font-split: true
  # Its postinstall only prints a funding message; the runtime modules need no build step.
  core-js: false
  esbuild: true
  koffi: true
  protobufjs: true
  workerd: true

# Supply-chain delay, in minutes: a version waits 24 hours before it can be installed, here and
# transitively. The rule is the workspace's, in its toolchain.md -- a path across that boundary
# resolves only while this project is nested, so it is named rather than linked.
minimumReleaseAge: 1440

# Exempt only where waiting a day costs more than it protects: toolchain and type packages,
# read at build time and not shipped. Keep it short -- every entry is an accepted risk.
minimumReleaseAgeExclude:
  - '@cloudflare/workers-types'
  - '@types/node'
  - vite
  - wrangler
  - '@cloudflare/unenv-preset@2.16.2'
  - miniflare@5.20260921.0-alpha
  # The author's own scopes, published from their own repositories by the author alone: a day's
  # wait protects against nobody, and would hold back a change made there and released.
  - '@canmi/*'
  - '@monoflake/*'
