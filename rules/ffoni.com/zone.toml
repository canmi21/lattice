# See rules/canmi.app/zone.toml for the shape, and spec/architecture/firewall.md.

[[rules]]
name = "Block Probes"
phase = "http_request_firewall_custom"
action = "block"
expression = "../all/block-probes.txt"

[[rules]]
name = "API Scopes Only"
phase = "http_request_firewall_custom"
action = "block"
expression = "api-scopes-only.txt"

[[rules]]
name = "CDN Prefixes Only"
phase = "http_request_firewall_custom"
action = "block"
expression = "cdn-prefixes-only.txt"

[[rules]]
name = "Redirect from HTTP to HTTPS"
phase = "http_request_dynamic_redirect"
action = "redirect"
expression = "http-to-https-redirect.txt"
target_expression = "http-to-https-redirect-target.txt"
status = 301

[[rules]]
name = "Redirect from WWW to root"
phase = "http_request_dynamic_redirect"
action = "redirect"
expression = "www-redirect.txt"
target_expression = "www-redirect-target.txt"
status = 301

[[rules]]
name = "Rate Cap"
phase = "http_ratelimit"
action = "block"
expression = "rate-cap.txt"
characteristics = ["cf.colo.id", "ip.src"]
period = 10
requests_per_period = 50
mitigation_timeout = 10
