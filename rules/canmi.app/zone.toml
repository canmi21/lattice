# See spec/architecture/firewall.md.

[[rules]]
name = "Pass Probe"
phase = "http_request_firewall_custom"
action = "skip"
skip_phases = ["http_ratelimit"]
expression = "../all/pass-probe.txt"

[[rules]]
name = "Block Probes"
phase = "http_request_firewall_custom"
action = "block"
expression = "../all/block-probes.txt"

[[rules]]
name = "Redirect to canmi.net"
phase = "http_request_dynamic_redirect"
action = "redirect"
expression = "canmi-net-redirect.txt"
target = { url = "APPS_PRODUCTION_SITE" }
preserve_query_string = true
status = 301

[[rules]]
name = "Rate Cap"
phase = "http_ratelimit"
action = "block"
expression = "rate-cap.txt"
characteristics = ["cf.colo.id", "ip.src"]
period = 10
requests_per_period = 300
mitigation_timeout = 10
