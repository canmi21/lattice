# See rules/canmi.app/zone.toml for the shape, and spec/architecture/firewall.md.

[[rules]]
name = "Block Probes"
phase = "http_request_firewall_custom"
action = "block"
expression = "../all/block-probes.txt"

[[rules]]
name = "Site Files Only"
phase = "http_request_firewall_custom"
action = "block"
expression = "site-files-only.txt"

[[rules]]
name = "Referral Redirect"
phase = "http_request_dynamic_redirect"
action = "redirect"
expression = "referral-redirect.txt"
target_expression = "referral-redirect-target.txt"
status = 301

[[rules]]
name = "Subdomain Migration"
phase = "http_request_dynamic_redirect"
action = "redirect"
expression = "subdomain-migration.txt"
target_expression = "subdomain-migration-target.txt"
preserve_query_string = true
status = 307

[[rules]]
name = "Rate Cap"
phase = "http_ratelimit"
action = "block"
expression = "rate-cap.txt"
characteristics = ["cf.colo.id", "ip.src"]
period = 10
requests_per_period = 150
mitigation_timeout = 10
