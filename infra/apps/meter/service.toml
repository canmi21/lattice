# What host needs to run this service. The record is read by host on the machine, a program
# deployed apart from this file, so it carries a version. See spec/architecture/host.md.
version = 1
name = "meter"
placements = ["home"]

# No port and no network: host reads it on its socket. See spec/architecture/meter.md.
[container]
socket = "meter.sock"
health = "/health"
memory_mb = 32

[data]
path = "/data"
