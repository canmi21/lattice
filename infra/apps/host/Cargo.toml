[package]
name = "host"
version = "0.0.0"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
response = { version = "2.0.0", features = ["axum"] }
deploy = { path = "../../libs/deploy" }
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["multipart"] }
jiff = { version = "0.2", features = ["serde"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "process", "fs"] }
tokio-util = { version = "0.7.19", features = ["io"] }
url = "2.5.8"
mimalloc = "0.1.52"

[dev-dependencies]
regex = "1"
http-body-util = "0.1.5"
tempfile = "3.27.0"
