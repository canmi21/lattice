# What host needs to run this service. The record is read by host on the machine, a program
# deployed apart from this file, so it carries a version. See spec/architecture/host.md.
version = 1
name = "tunnel"
placements = ["home"]

# Its routes live in Cloudflare's dashboard, and its token in its `secret.env` on the node. host
# asks its metrics server whether it holds a connection to Cloudflare.
[container]
port = 20820
health = "/ready"
# About 20 MiB.
memory_mb = 64
