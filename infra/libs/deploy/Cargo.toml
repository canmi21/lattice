[package]
name = "deploy"
version = "0.0.0"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
bollard = "0.21.1"
bytes = "1.12.1"
futures-util = "0.3.34"
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["client", "http1"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "tls12", "ring", "webpki-tokio"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "tokio"] }
jiff = "0.2"
# The btrfs ioctls, which is the one reason this crate touches raw syscalls.
libc = "0.2.190"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["net", "fs", "time", "rt", "io-util"] }
toml = "1.1.6"
canmi = "=2026.1004.0"
zip = { version = "8", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["macros", "rt"] }
