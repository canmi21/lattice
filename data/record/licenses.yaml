# Licences worked out by reading a package, because the package never declared one. An entry
# only ever fills a gap, and `cms licenses` reports one whose package has since declared its
# own, so the list shrinks by itself. See spec/architecture/data.md, "A dependency's licence".

version: 1

asserted:
  pkg:npm/format@0.2.2:
    spdx: MIT
    note: >-
      Ships no LICENSE file and no `license` field. Readme.md carries the heading "License",
      the line "Copyright 2010 - 2014 Sami Samhuri sami@samhuri.net" and a link to
      http://sjs.mit-license.org. The package.json author matches that name.

  pkg:npm/sqlite-wasm-kysely@0.3.0:
    spdx: MIT
    note: >-
      Ships a verbatim MIT text as LICENSE, headed "MIT License" with "Copyright (c) 2024
      Opral US Inc.". Only the package.json field is missing, so the text is the declaration.

  pkg:npm/svelte-toolbelt@0.10.6:
    spdx: MIT
    note: >-
      Ships a verbatim MIT text as LICENSE, headed "MIT License" with "Copyright (c) 2024
      Hunter Johnston" and "Copyright (c) 2024 Thomas G. Lopes". Only the package.json field
      is missing, so the text is the declaration.
