# Builds the images a push changed and leaves them as artifacts of this run. Nothing is published
# and nothing here reaches a machine: when the run ends, GitHub's webhook tells the node, and the
# node fetches and checks what was built. See spec/architecture/host.md.
name: Deploy

on:
  push:
    branches: [main]
  # The first of each month rebuilds geo, whose image fetches GeoNames as it is built.
  schedule:
    - cron: "17 4 1 * *"
  workflow_dispatch:
    inputs:
      apps:
        description: "Apps to build, space-separated; empty for every one"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04-arm
    outputs:
      apps: ${{ steps.plan.outputs.apps }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          ASKED: ${{ inputs.apps }}
        run: |
          if [ "$EVENT" = schedule ]; then
            apps='["geo"]'
          elif [ "$EVENT" = workflow_dispatch ] && [ -n "$ASKED" ]; then
            apps="$(printf '%s\n' $ASKED | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read().split()))')"
          elif [ "$EVENT" = workflow_dispatch ] || [ -z "${BEFORE//0/}" ]; then
            apps="$(.mise/tasks/deployable --all)"
          else
            apps="$(.mise/tasks/deployable --git "$BEFORE")"
          fi
          echo "apps=$apps" >> "$GITHUB_OUTPUT"
          echo "building: $apps"

  build:
    needs: plan
    if: needs.plan.outputs.apps != '[]'
    runs-on: ubuntu-24.04-arm
    # ClickHouse compiles for hours; every other app finishes in minutes and this caps the one
    # that does not. GitHub's own default, 360, already covers it, but naming the number here is
    # what makes the room for apps/clickhouse legible without reading GitHub's defaults.
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.plan.outputs.apps) }}
    steps:
      # The workspace above the project, as it is checked out at home: its rust-toolchain.toml is
      # the compiler every image is built with.
      - uses: actions/checkout@v7
        with:
          repository: canmi21/canmi
      - uses: actions/checkout@v7
        with:
          path: repos/lattice
      # The hosted runner carries toolchains nothing here uses -- Android's SDK, .NET, Haskell,
      # Swift, a browser fleet -- tens of gigabytes an ordinary build does not mind losing and a
      # source build of ClickHouse needs. Each path is removed only if it exists, and in parallel
      # since they share nothing. See spec/architecture/databases.md, "CI makes room first".
      - name: Free disk space
        run: |
          df -h /
          for path in /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift \
            /usr/lib/powershell /opt/microsoft/powershell \
            "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" /usr/local/share/chromium /opt/az; do
            sudo rm -rf "$path" &
          done
          docker image prune --all --force &
          wait
          df -h /
      # The runner's default builder cannot export an image as an archive; a container builder can.
      - uses: docker/setup-buildx-action@v4
      - env:
          APP: ${{ matrix.app }}
        run: |
          mkdir -p "$RUNNER_TEMP/deploy"
          repos/lattice/.mise/tasks/image "$APP" "$RUNNER_TEMP/deploy/image.tar"
          cp "repos/lattice/apps/$APP/service.toml" "$RUNNER_TEMP/deploy/"
      # The image layers are compressed already; the node needs it for as long as a deploy takes.
      - uses: actions/upload-artifact@v7
        with:
          name: deploy-${{ matrix.app }}
          path: ${{ runner.temp }}/deploy/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
