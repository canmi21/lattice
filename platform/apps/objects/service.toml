# What host needs to run this service. The record is read by host on the machine, a program
# deployed apart from this file, so it carries a version. See spec/architecture/host.md.
version = 1
name = "objects"
placements = ["home"]

# Never run under this name: every app's `<app>-objects` sidecar runs this image, on this port and
# under this ceiling, and host asks each one this health path. See spec/architecture/objects.md.
[container]
port = 17070
health = "/health"
memory_mb = 256
